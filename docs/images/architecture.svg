<svg xmlns="http://www.w3.org/2000/svg" width="680" height="626" viewBox="0 0 680 626" role="img" font-family="'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',-apple-system,'Segoe UI',sans-serif">
<title>eval-agent 전체 구조와 에이전트 내부 흐름</title>
<desc>CLI와 API는 LangGraph 에이전트로, Claude Desktop은 MCP 서버로 들어가고, 둘 다 공통 도구 4개를 거쳐 PostgreSQL과 기준 문서를 조회하는 구조. 에이전트 안에서는 agent와 tools 노드가 반복하다가 finalize로 끝나거나 한도에 닿으면 limit로 끝난다.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.bg{fill:#ffffff}
.th{font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central}
.ts{font-size:12px;text-anchor:middle;dominant-baseline:central}
.l{text-anchor:start}
.gray{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:.5}
.teal{fill:#E1F5EE;stroke:#0F6E56;stroke-width:.5}
.purple{fill:#EEEDFE;stroke:#534AB7;stroke-width:.5}
.inner{fill:#ffffff;stroke:#0F6E56;stroke-width:.5}
.tg{fill:#2C2C2A}.tgs{fill:#5F5E5A}
.tt{fill:#085041}.tts{fill:#0F6E56}
.tp{fill:#3C3489}.tps{fill:#534AB7}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
</style>
</defs>
<rect class="bg" width="680" height="626"/>

<rect class="gray" x="40" y="30" width="170" height="56" rx="8"/>
<text class="th tg" x="125" y="49">CLI</text><text class="ts tgs" x="125" y="67">scripts/ask.py</text>
<rect class="gray" x="235" y="30" width="170" height="56" rx="8"/>
<text class="th tg" x="320" y="49">POST /ask</text><text class="ts tgs" x="320" y="67">FastAPI</text>
<rect class="gray" x="470" y="30" width="170" height="56" rx="8"/>
<text class="th tg" x="555" y="49">Claude Desktop</text><text class="ts tgs" x="555" y="67">또는 Claude Code</text>

<line class="arr" x1="125" y1="88" x2="125" y2="142" marker-end="url(#arrow)"/>
<line class="arr" x1="320" y1="88" x2="320" y2="142" marker-end="url(#arrow)"/>
<line class="arr" x1="555" y1="88" x2="555" y2="142" marker-end="url(#arrow)"/>

<rect class="teal" x="40" y="146" width="406" height="220" rx="12"/>
<text class="th l tt" x="60" y="168">에이전트 (agent/ · LangGraph)</text>
<text class="ts l tts" x="60" y="186">Claude API로 도구를 고르고 답변 생성</text>

<rect class="inner" x="56" y="200" width="92" height="52" rx="8"/>
<text class="th tt" x="102" y="218">finalize</text><text class="ts tts" x="102" y="236">근거 붙이기</text>
<rect class="inner" x="188" y="200" width="100" height="52" rx="8"/>
<text class="th tt" x="238" y="218">agent</text><text class="ts tts" x="238" y="236">Claude 호출</text>
<rect class="inner" x="326" y="200" width="100" height="52" rx="8"/>
<text class="th tt" x="376" y="218">tools</text><text class="ts tts" x="376" y="236">도구 실행</text>
<rect class="inner" x="188" y="290" width="100" height="52" rx="8"/>
<text class="th tt" x="238" y="308">limit</text><text class="ts tts" x="238" y="326">한도 도달 시</text>

<line class="arr" x1="186" y1="226" x2="150" y2="226" marker-end="url(#arrow)"/>
<line class="arr" x1="290" y1="214" x2="324" y2="214" marker-end="url(#arrow)"/>
<line class="arr" x1="324" y1="238" x2="290" y2="238" marker-end="url(#arrow)"/>
<line class="arr" x1="238" y1="254" x2="238" y2="288" marker-end="url(#arrow)"/>

<line class="arr" x1="376" y1="254" x2="376" y2="406" marker-end="url(#arrow)"/>
<line class="arr" x1="555" y1="212" x2="555" y2="406" marker-end="url(#arrow)"/>

<rect class="teal" x="470" y="146" width="170" height="64" rx="8"/>
<text class="th tt" x="555" y="168">MCP 서버</text><text class="ts tts" x="555" y="188">mcp_server/</text>

<rect class="purple" x="40" y="410" width="600" height="64" rx="8"/>
<text class="th tp" x="340" y="432">도구 4개 (tools/)</text><text class="ts tps" x="340" y="452">읽기 전용 · 고정 파라미터 함수</text>

<line class="arr" x1="170" y1="476" x2="170" y2="526" marker-end="url(#arrow)"/>
<line class="arr" x1="510" y1="476" x2="510" y2="526" marker-end="url(#arrow)"/>

<rect class="gray" x="40" y="530" width="260" height="56" rx="8"/>
<text class="th tg" x="170" y="549">PostgreSQL</text><text class="ts tgs" x="170" y="567">더미 평가 데이터</text>
<rect class="gray" x="380" y="530" width="260" height="56" rx="8"/>
<text class="th tg" x="510" y="549">기준 문서</text><text class="ts tgs" x="510" y="567">docs/policy/*.md</text>
</svg>
